  <div class="container">
    <main>
      <section class="card">
        <div class="page-head">
          <h1 class="page-title">Contact</h1>
          <div class="social">
            <a href="https://github.com/vobradovic17" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
            </a>
            <a href="https://es.linkedin.com/in/vladimir-obradovi%C4%87-392739387" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
            </a>
          </div>
        </div>
        <div class="contact__wrapper">
          <div class="contact__links">
            <p>Write me a message and I will get back to you as soon as possible.</p>
          </div>
          <form id="contact-form" class="contact-form" novalidate>
            <div class="form-field">
              <label for="cf-name">Name</label>
              <input id="cf-name" name="name" type="text" maxlength="100" required>
            </div>
            <div class="form-field">
              <label for="cf-email">Email</label>
              <input id="cf-email" name="email" type="email" maxlength="200" required>
            </div>
            <div class="form-field form-field__message">
              <label for="cf-message">Message</label>
              <textarea id="cf-message" name="message" rows="6" maxlength="5000" required></textarea>
            </div>
            <div class="hp" aria-hidden="true">
              <label for="cf-website">Website</label>
              <input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>
            <button class="btn submit" type="submit">Send message</button>
            <p class="form-status" id="form-status" role="status"></p>
          </form>
        </div>
      </section>
      <script>
        const form = document.getElementById('contact-form');
        const statusEl = document.getElementById('form-status');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          statusEl.className = 'form-status';
          if (!form.checkValidity()) { form.reportValidity(); return; }
          const btn = form.querySelector('button');
          btn.disabled = true;
          statusEl.textContent = 'Sending…';
          try {
            const res = await fetch('/contact', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(Object.fromEntries(new FormData(form)))
            });
            if (!res.ok) throw new Error(res.status);
            form.reset();
            statusEl.className = 'form-status ok';
            statusEl.textContent = 'Thank you! Your message was sent successfully. I will get back to you as soon as possible.';
          } catch (err) {
            statusEl.className = 'form-status error';
            statusEl.textContent = 'Sorry, something went wrong. Please try again later.';
          } finally {
            btn.disabled = false;
          }
        });
      </script>
    </main>
  </div>
  <script src="/nav.js" defer></script>
