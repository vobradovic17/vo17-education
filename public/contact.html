<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – Vladimir Obradović</title>
  <meta name="description" content="Get in touch with Vladimir Obradović.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="logo" aria-hidden="true">VO</div>
      <span class="header-name">Vladimir Obradović</span>
      <nav class="tabs">
        <a class="tab" href="/">Home</a>
        <a class="tab" href="/projects.html">Projects</a>
        <a class="tab active" href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <main>
      <section class="card">
        <h1 class="page-title">Contact</h1>
        <div class="contact__wrapper">
          <div class="contact__links">
            <p>Write me a message and I will get back to you as soon as possible.</p>
            <h2>Links</h2>
            <p class="lines contact-links">
              <a href="https://github.com/vobradovic17">GitHub</a><br>
              <a href="https://es.linkedin.com/in/vladimir-obradovi%C4%87-392739387">LinkedIn</a>
            </p>
          </div>
          <form id="contact-form" class="contact-form" novalidate>
            <div class="form-field">
              <label for="cf-name">Name</label>
              <input id="cf-name" name="name" type="text" maxlength="100" required>
            </div>
            <div class="form-field">
              <label for="cf-email">Email</label>
              <input id="cf-email" name="email" type="email" maxlength="200" required>
            </div>
            <div class="form-field">
              <label for="cf-message">Message</label>
              <textarea id="cf-message" name="message" rows="6" maxlength="5000" required></textarea>
            </div>
            <div class="hp" aria-hidden="true">
              <label for="cf-website">Website</label>
              <input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>
            <button class="btn submit" type="submit">Send message</button>
            <p class="form-status" id="form-status" role="status"></p>
          </form>
        </div>
      </section>
      <script>
        const form = document.getElementById('contact-form');
        const statusEl = document.getElementById('form-status');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          statusEl.className = 'form-status';
          if (!form.checkValidity()) { form.reportValidity(); return; }
          const btn = form.querySelector('button');
          btn.disabled = true;
          statusEl.textContent = 'Sending…';
          try {
            const res = await fetch('/contact', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(Object.fromEntries(new FormData(form)))
            });
            if (!res.ok) throw new Error(res.status);
            form.reset();
            statusEl.className = 'form-status ok';
            statusEl.textContent = 'Thank you! Your message was sent successfully. I will get back to you as soon as possible.';
          } catch (err) {
            statusEl.className = 'form-status error';
            statusEl.textContent = 'Sorry, something went wrong. Please try again later.';
          } finally {
            btn.disabled = false;
          }
        });
      </script>
    </main>
  </div>
</body>
</html>
